[theme]
# Base par defaut : clair. Toggle sombre disponible dans la sidebar.
base = "light"
primaryColor = "#5B6FED"
backgroundColor = "#F8F9FB"
secondaryBackgroundColor = "#FFFFFF"
textColor = "#1E2A3B"
font = "sans serif"

[server]
headless = true
runOnSave = false

[browser]
gatherUsageStats = false

[client]
showErrorDetails = true
toolbarMode = "minimal"
